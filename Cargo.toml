[package]
name = "songrequestz"
version = "0.0.0" # unused: releases are versioned by git tags (see build workflow)
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
