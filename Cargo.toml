[package]
name = "songrequestz"
version = "0.0.0" # unused: releases are versioned by git tags (see build workflow)
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "io-util", "process"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
base64 = "0.22"
fltk = { version = "1.5.23", features = ["no-images"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
fltk = { version = "1.5.23", features = ["use-wayland"] }
ksni = "0.3.6"
# Already in for ksni (the tray); used directly for the Spotify app (MPRIS).
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target."cfg(windows)".dependencies]
fltk = { version = "1.5.23", features = ["static-msvcrt"] }
tray-icon = { version = "0.26.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.11"
